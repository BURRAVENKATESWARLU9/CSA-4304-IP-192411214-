<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StyleHub Fashion Store</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#fbf7f2;color:#302d2a}header{background:#40352e;color:white;text-align:center;padding:24px}nav{background:#251f1b;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px}button{background:#88664d;color:white;border:0;padding:10px 13px;border-radius:5px;cursor:pointer;margin:3px}nav button{background:transparent;border:1px solid #d8c5b5}.wrap{max-width:1100px;margin:22px auto;padding:12px}.panel,.product{background:white;padding:17px;border-radius:9px;box-shadow:0 2px 8px #e6ddd5;margin-bottom:15px}h2{color:#88664d}input,select,textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #d8cec5;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.hidden{display:none}.sale{color:#247648;font-weight:bold}footer{text-align:center;background:#251f1b;color:white;padding:15px}@media(max-width:600px){.wrap{padding:8px}}
</style></head><body><header><h1>👗 StyleHub</h1><p>Fashion for every style and every season</p></header><nav><button onclick="page('home')">Shop</button><button onclick="page('register')">Register</button><button onclick="page('login')">Login</button><button onclick="page('cart')">Cart</button><button onclick="page('wishlist')">Wishlist</button><button onclick="page('orders')">My Orders</button><button onclick="page('admin')">Admin</button></nav><main class="wrap">
<section id="home" class="view"><div class="panel"><h2>Explore Fashion</h2><input id="search" placeholder="Search products, styles, or subcategories" oninput="render()"><select id="cat" onchange="render()"><option>All Categories</option><option>Men</option><option>Women</option><option>Children</option><option>Footwear</option><option>Accessories</option></select><select id="style" onchange="render()"><option>All Styles</option><option>Casual Wear</option><option>Formal Wear</option><option>Seasonal Collection</option><option>Sportswear</option></select><label><input type="checkbox" id="saleOnly" style="width:auto" onchange="render()"> Sale items only</label></div><div class="panel"><h2>Product Catalogue</h2><div id="products" class="grid"></div></div></section>
<section id="register" class="view hidden"><div class="panel"><h2>Create Account</h2><form id="rf"><input id="rn" placeholder="Full name" required><input id="re" type="email" placeholder="Email" required><input id="rp" type="password" minlength="6" placeholder="Password" required><button>Register</button></form><p id="rmsg"></p></div></section>
<section id="login" class="view hidden"><div class="panel"><h2>Login</h2><form id="lf"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button>Login</button></form><p id="lmsg"></p><button onclick="logout()">Logout</button></div></section>
<section id="cart" class="view hidden"><div class="panel"><h2>Shopping Cart</h2><div id="cartlist"></div><h3 id="total"></h3><form id="checkout"><input id="address" placeholder="Shipping address" required><select id="pay"><option>Cash on Delivery (Demo)</option><option>Online Payment (Demo only)</option></select><button>Place Order</button></form><p id="cmsg"></p></div></section>
<section id="wishlist" class="view hidden"><div class="panel"><h2>Wishlist</h2><div id="wishlist"></div></div></section>
<section id="orders" class="view hidden"><div class="panel"><h2>Order History and Tracking</h2><div id="orderlist"></div></div></section>
<section id="admin" class="view hidden"><div class="panel"><h2>StyleHub Admin (Demo)</h2><form id="pf"><input id="pn" placeholder="Product name" required><select id="pc"><option>Women</option><option>Men</option><option>Children</option><option>Footwear</option><option>Accessories</option></select><input id="sub" placeholder="Subcategory" required><select id="sty"><option>Casual Wear</option><option>Formal Wear</option><option>Seasonal Collection</option><option>Sportswear</option></select><input id="size" placeholder="Available sizes e.g. S, M, L, XL" required><input id="price" type="number" min="1" placeholder="Price" required><input id="stock" type="number" min="0" placeholder="Stock" required><input id="off" type="number" min="0" max="90" value="0" placeholder="Discount %"><textarea id="desc" placeholder="Product description" required></textarea><button>Add Product</button></form><h3>Manage Catalogue</h3><div id="manage"></div><h3>Customer Orders</h3><div id="adminorders"></div></div></section>
</main><footer>StyleHub | Online Fashion Shopping Lab Demo</footer><script>
const seed=[{id:1,name:'Classic Cotton T-Shirt',cat:'Men',sub:'T-Shirts',style:'Casual Wear',sizes:'S, M, L, XL',price:799,stock:20,off:10,desc:'Comfortable cotton everyday T-shirt.'},{id:2,name:'Floral Summer Dress',cat:'Women',sub:'Dresses',style:'Seasonal Collection',sizes:'S, M, L',price:1899,stock:10,off:15,desc:'Lightweight floral dress for warm days.'},{id:3,name:'Formal Office Shirt',cat:'Men',sub:'Shirts',style:'Formal Wear',sizes:'M, L, XL',price:1499,stock:12,off:0,desc:'Smart formal shirt for office and events.'},{id:4,name:'Kids Hoodie',cat:'Children',sub:'Outerwear',style:'Casual Wear',sizes:'4Y, 6Y, 8Y, 10Y',price:999,stock:14,off:5,desc:'Soft hoodie for children.'},{id:5,name:'Running Sneakers',cat:'Footwear',sub:'Sports Shoes',style:'Sportswear',sizes:'6, 7, 8, 9, 10',price:2499,stock:9,off:10,desc:'Lightweight sneakers for daily workouts.'},{id:6,name:'Leather Belt',cat:'Accessories',sub:'Belts',style:'Formal Wear',sizes:'S, M, L',price:699,stock:15,off:0,desc:'Classic accessory for formal outfits.'}];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let products=load('shProducts',seed),users=load('shUsers',[]),orders=load('shOrders',[]),cart=load('shCart',[]),wish=load('shWish',[]),user=load('shUser',null);
function page(id){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='cart')renderCart();if(id==='wishlist')renderWish();if(id==='orders')renderOrders();if(id==='admin')renderAdmin()}
function cost(p){return Math.round(p.price*(1-p.off/100))}
function render(){let q=search.value.toLowerCase(),c=cat.value,s=style.value,only=saleOnly.checked;let a=products.filter(p=>(c==='All Categories'||p.cat===c)&&(s==='All Styles'||p.style===s)&&(p.name+' '+p.sub+' '+p.desc).toLowerCase().includes(q)&&(!only||p.off>0));productsEl.innerHTML=a.map(p=>`<div class="product"><h3>${esc(p.name)}</h3><p>${esc(p.cat)} / ${esc(p.sub)} — ${esc(p.style)}</p><p>${esc(p.desc)}</p><p>Sizes: ${esc(p.sizes)}</p><p>Availability: ${p.stock?'In stock ('+p.stock+')':'Out of stock'}</p><p><s>${p.off?'₹'+p.price:''}</s> <b>₹${cost(p)}</b> ${p.off?`<span class="sale">${p.off}% off</span>`:''}</p><button ${p.stock<1?'disabled':''} onclick="add(${p.id})">Choose Size & Add</button><button onclick="toggleWish(${p.id})">♡ Wishlist</button></div>`).join('')||'No products found.'}
const productsEl=document.getElementById('products');
function add(id){if(!user){alert('Please log in first');page('login');return}let p=products.find(x=>x.id===id);if(!p||!p.stock)return;let sz=prompt('Available sizes: '+p.sizes+'\\nEnter your size');if(!sz)return;if(!p.sizes.split(',').map(x=>x.trim().toLowerCase()).includes(sz.trim().toLowerCase())){alert('Choose a listed size');return}let i=cart.find(x=>x.id===id&&x.email===user.email&&x.size.toLowerCase()===sz.trim().toLowerCase());if(i)i.qty=Math.min(i.qty+1,p.stock);else cart.push({id,email:user.email,size:sz.trim(),qty:1});save('shCart',cart);alert('Added to cart')}
function toggleWish(id){if(!user){alert('Please log in first');page('login');return}let i=wish.findIndex(x=>x.id===id&&x.email===user.email);if(i>=0)wish.splice(i,1);else wish.push({id,email:user.email});save('shWish',wish);renderWish()}
function renderCart(){if(!user){cartlist.innerHTML='Please log in.';total.textContent='';return}let a=cart.filter(i=>i.email===user.email);cartlist.innerHTML=a.map(i=>{let p=products.find(x=>x.id===i.id);return p?`<div class="product"><b>${esc(p.name)}</b> · Size ${esc(i.size)} · ₹${cost(p)} each<label>Quantity</label><input type="number" min="1" max="${p.stock}" value="${i.qty}" onchange="qty(${p.id},'${esc(i.size)}',this.value)"><button onclick="removeItem(${p.id},'${esc(i.size)}')">Remove</button></div>`:''}).join('')||'Cart is empty';total.textContent='Total: ₹'+a.reduce((sum,i)=>sum+(products.find(p=>p.id===i.id)?cost(products.find(p=>p.id===i.id))*i.qty:0),0)}
function qty(id,size,n){let i=cart.find(x=>x.id===id&&x.size===size&&x.email===user.email),p=products.find(x=>x.id===id);if(i)i.qty=Math.max(1,Math.min(p.stock,Number(n)||1));save('shCart',cart);renderCart()}
function removeItem(id,size){cart=cart.filter(i=>!(i.id===id&&i.size===size&&i.email===user.email));save('shCart',cart);renderCart()}
rf.onsubmit=e=>{e.preventDefault();let email=re.value.toLowerCase().trim();if(users.some(u=>u.email===email)){rmsg.textContent='Email already registered';return}users.push({name:rn.value,email,password:rp.value});save('shUsers',users);rmsg.textContent='Registration successful. Log in.';e.target.reset()};
lf.onsubmit=e=>{e.preventDefault();let u=users.find(x=>x.email===le.value.toLowerCase().trim()&&x.password===lp.value);if(!u){lmsg.textContent='Invalid login';return}user={name:u.name,email:u.email};save('shUser',user);lmsg.textContent='Welcome, '+u.name};
function logout(){user=null;localStorage.removeItem('shUser');lmsg.textContent='Logged out'}
checkout.onsubmit=e=>{e.preventDefault();if(!user){alert('Log in first');return}let a=cart.filter(i=>i.email===user.email);if(!a.length){cmsg.textContent='Cart is empty';return}for(let i of a){let p=products.find(p=>p.id===i.id);if(!p||p.stock<i.qty){alert('Not enough stock');return}}a.forEach(i=>products.find(p=>p.id===i.id).stock-=i.qty);let o={id:'SH'+Date.now().toString().slice(-8),email:user.email,customer:user.name,address:address.value,payment:pay.value,items:a.map(i=>({...i,name:products.find(p=>p.id===i.id).name,price:cost(products.find(p=>p.id===i.id))})),total:a.reduce((s,i)=>s+cost(products.find(p=>p.id===i.id))*i.qty,0),status:'Order Placed'};orders.push(o);cart=cart.filter(i=>i.email!==user.email);save('shOrders',orders);save('shCart',cart);save('shProducts',products);cmsg.textContent='Order placed: '+o.id+' (demo checkout; no payment processed)';renderCart();renderAdmin()};
function renderOrders(){if(!user){orderlist.innerHTML='Please log in';return}orderlist.innerHTML=orders.filter(o=>o.email===user.email).map(o=>`<div class="product"><h3>${esc(o.id)}</h3><p>${o.items.map(i=>esc(i.name)+' · '+esc(i.size)+' × '+i.qty).join(', ')}</p><p>Shipping: ${esc(o.address)}</p><p>Total ₹${o.total} · Status: <b>${esc(o.status)}</b></p></div>`).join('')||'No orders yet'}
function renderWish(){if(!user){wishlist.innerHTML='Please log in';return}wishlist.innerHTML=wish.filter(w=>w.email===user.email).map(w=>{let p=products.find(p=>p.id===w.id);return p?`<div class="product">${esc(p.name)} — ₹${cost(p)} <button onclick="add(${p.id})">Choose size</button><button onclick="toggleWish(${p.id})">Remove</button></div>`:''}).join('')||'Wishlist is empty'}
pf.onsubmit=e=>{e.preventDefault();products.push({id:Date.now(),name:pn.value,cat:pc.value,sub:sub.value,style:sty.value,sizes:size.value,price:Number(price.value),stock:Number(stock.value),off:Number(off.value),desc:desc.value});save('shProducts',products);e.target.reset();render();renderAdmin()};
function edit(id){let p=products.find(x=>x.id===id),v=prompt('New price',p.price);if(v!==null&&Number(v)>0)p.price=Number(v);let d=prompt('New description',p.desc);if(d!==null)p.desc=d;let st=prompt('New stock quantity',p.stock);if(st!==null&&Number(st)>=0)p.stock=Number(st);save('shProducts',products);render();renderAdmin()}
function del(id){if(confirm('Remove product?')){products=products.filter(p=>p.id!==id);save('shProducts',products);render();renderAdmin()}}
function renderAdmin(){manage.innerHTML=products.map(p=>`<div class="product"><b>${esc(p.name)}</b> — ₹${p.price}, stock ${p.stock}<button onclick="edit(${p.id})">Edit</button><button onclick="del(${p.id})">Delete</button></div>`).join('');adminorders.innerHTML=orders.map(o=>`<div class="product">${esc(o.id)} — ${esc(o.customer)} (${esc(o.email)}) — ${esc(o.address)}<p>Total ₹${o.total} · ${esc(o.status)}</p><select id="s${o.id}"><option>Order Placed</option><option>Packed</option><option>Shipped</option><option>Delivered</option><option>Return Requested</option><option>Exchange Requested</option><option>Cancelled</option></select><button onclick="setStatus('${o.id}')">Update Status</button></div>`).join('')||'No customer orders';orders.forEach(o=>{let s=document.getElementById('s'+o.id);if(s)s.value=o.status})}
function setStatus(id){let o=orders.find(x=>x.id===id);o.status=document.getElementById('s'+id).value;save('shOrders',orders);renderAdmin();renderOrders()}
render();renderAdmin();
</script></body></html>
