<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechSavvy Electronics</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f3f6fb;color:#233044}header{background:#243b73;color:white;text-align:center;padding:24px}nav{background:#17264d;padding:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{padding:10px 13px;border:0;border-radius:5px;background:#3159a8;color:white;cursor:pointer;margin:3px}nav button{background:transparent;border:1px solid #b9c8ef}.wrap{max-width:1100px;margin:22px auto;padding:12px}.panel,.product{background:white;border-radius:9px;padding:17px;margin-bottom:15px;box-shadow:0 2px 8px #d9e0ed}h2{color:#3159a8}input,select,textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccd4e1;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.hidden{display:none}.tag{color:#24744b;font-weight:bold}footer{text-align:center;background:#17264d;color:white;padding:15px}@media(max-width:600px){.wrap{padding:8px}}
</style></head><body><header><h1>💻 TechSavvy Electronics</h1><p>Smart gadgets. Smarter shopping.</p></header><nav><button onclick="page('home')">Shop</button><button onclick="page('register')">Register</button><button onclick="page('login')">Login</button><button onclick="page('cart')">Cart</button><button onclick="page('orders')">Orders</button><button onclick="page('wishlist')">Wishlist</button><button onclick="page('admin')">Admin</button></nav><main class="wrap">
<section id="home" class="view"><div class="panel"><h2>Find Products</h2><input id="search" placeholder="Search products..." oninput="renderProducts()"><select id="cat" onchange="renderProducts()"><option>All Categories</option><option>Smartphones</option><option>Laptops</option><option>Tablets</option><option>Accessories</option></select><label><input id="discount" type="checkbox" style="width:auto" onchange="renderProducts()"> Discounted only</label></div><div class="panel"><h2>Product Catalogue</h2><div id="products" class="grid"></div></div></section>
<section id="register" class="view hidden"><div class="panel"><h2>Register</h2><form id="rf"><input id="rn" placeholder="Full name" required><input id="re" type="email" placeholder="Email" required><input id="rp" type="password" minlength="6" placeholder="Password" required><button>Register</button></form><p id="rmsg"></p></div></section>
<section id="login" class="view hidden"><div class="panel"><h2>Login</h2><form id="lf"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button>Login</button></form><p id="lmsg"></p><button onclick="logout()">Logout</button></div></section>
<section id="cart" class="view hidden"><div class="panel"><h2>Shopping Cart</h2><div id="cartlist"></div><h3 id="total"></h3><form id="checkout"><input id="address" placeholder="Delivery address" required><select id="payment"><option>Cash on Delivery (Demo)</option><option>Online Payment (Demo only)</option></select><button>Checkout</button></form><p id="cmsg"></p></div></section>
<section id="orders" class="view hidden"><div class="panel"><h2>Order History and Status</h2><div id="orderlist"></div></div></section>
<section id="wishlist" class="view hidden"><div class="panel"><h2>My Wishlist</h2><div id="wishlist"></div></div></section>
<section id="admin" class="view hidden"><div class="panel"><h2>Admin Panel (Demo)</h2><form id="pf"><input id="pn" placeholder="Product name" required><select id="pc"><option>Smartphones</option><option>Laptops</option><option>Tablets</option><option>Accessories</option></select><input id="ps" placeholder="Subcategory / model" required><input id="price" type="number" min="1" placeholder="Price" required><input id="stock" type="number" min="0" placeholder="Stock" required><input id="off" type="number" min="0" max="90" placeholder="Discount percent (0-90)" value="0"><textarea id="desc" placeholder="Description" required></textarea><button>Add Product</button></form><h3>Manage Products</h3><div id="manage"></div><h3>Customer Checkout Information</h3><div id="customers"></div><h3>Manage Orders</h3><div id="adminorders"></div></div></section>
</main><footer>TechSavvy | Online Electronics Store Lab Demo</footer><script>
const seed=[{id:1,name:'Nova X Smartphone',cat:'Smartphones',sub:'Android Phones',price:24999,stock:12,off:10,desc:'Fast smartphone with vivid display and high-resolution camera.'},{id:2,name:'ProBook Laptop',cat:'Laptops',sub:'Student Laptops',price:55999,stock:7,off:5,desc:'Lightweight laptop for study, work, and everyday tasks.'},{id:3,name:'TabPlus 10',cat:'Tablets',sub:'10-inch Tablets',price:18999,stock:8,off:0,desc:'Portable tablet for reading, video, and productivity.'},{id:4,name:'Wireless Earbuds',cat:'Accessories',sub:'Audio',price:2999,stock:25,off:15,desc:'Wireless earbuds with charging case.'},{id:5,name:'Fast Charger',cat:'Accessories',sub:'Chargers',price:999,stock:30,off:0,desc:'Compact USB-C fast charger.'},{id:6,name:'Ultra Smartphone',cat:'Smartphones',sub:'Premium Phones',price:49999,stock:5,off:8,desc:'Premium phone with advanced performance.'}];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let products=load('tsProducts',seed),users=load('tsUsers',[]),orders=load('tsOrders',[]),cart=load('tsCart',[]),wish=load('tsWish',[]),user=load('tsUser',null);
function page(id){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='cart')renderCart();if(id==='orders')renderOrders();if(id==='wishlist')renderWish();if(id==='admin')renderAdmin()}
function finalPrice(p){return Math.round(p.price*(1-p.off/100))}
function renderProducts(){let q=search.value.toLowerCase(),c=cat.value,only=discount.checked;let a=products.filter(p=>(c==='All Categories'||p.cat===c)&&(p.name+' '+p.sub+' '+p.desc).toLowerCase().includes(q)&&(!only||p.off>0));productsEl.innerHTML=a.map(p=>`<div class="product"><h3>${esc(p.name)}</h3><p>${esc(p.cat)} / ${esc(p.sub)}</p><p>${esc(p.desc)}</p><p>Availability: ${p.stock>0?'In stock ('+p.stock+')':'Out of stock'}</p><p><s>${p.off?'₹'+p.price:''}</s> <b>₹${finalPrice(p)}</b> ${p.off?`<span class="tag">${p.off}% off</span>`:''}</p><button ${p.stock<1?'disabled':''} onclick="add(${p.id})">Add to Cart</button><button onclick="toggleWish(${p.id})">♡ Wishlist</button></div>`).join('')||'No products found.'}
const productsEl=document.getElementById('products');
function add(id){if(!user){alert('Please log in first');page('login');return}let p=products.find(x=>x.id===id),item=cart.find(x=>x.id===id&&x.email===user.email);if(!p||p.stock<1)return;if(item)item.qty=Math.min(item.qty+1,p.stock);else cart.push({id,email:user.email,qty:1});save('tsCart',cart);alert('Added to cart')}
function toggleWish(id){if(!user){alert('Please log in first');page('login');return}let i=wish.findIndex(w=>w.id===id&&w.email===user.email);if(i>=0)wish.splice(i,1);else wish.push({id,email:user.email});save('tsWish',wish);renderWish()}
function renderCart(){if(!user){cartlist.innerHTML='Please log in.';total.textContent='';return}let a=cart.filter(x=>x.email===user.email);cartlist.innerHTML=a.map(i=>{let p=products.find(p=>p.id===i.id);if(!p)return '';return `<div class="product"><b>${esc(p.name)}</b> — ₹${finalPrice(p)} each <label>Quantity</label><input type="number" min="1" max="${p.stock}" value="${i.qty}" onchange="qty(${p.id},this.value)"><button onclick="removeItem(${p.id})">Remove</button></div>`}).join('')||'Your cart is empty.';total.textContent='Total: ₹'+a.reduce((s,i)=>s+(products.find(p=>p.id===i.id)?finalPrice(products.find(p=>p.id===i.id))*i.qty:0),0)}
function qty(id,n){let i=cart.find(x=>x.id===id&&x.email===user.email),p=products.find(x=>x.id===id);if(i)i.qty=Math.max(1,Math.min(p.stock,Number(n)||1));save('tsCart',cart);renderCart()}
function removeItem(id){cart=cart.filter(x=>!(x.id===id&&x.email===user.email));save('tsCart',cart);renderCart()}
rf.onsubmit=e=>{e.preventDefault();let email=re.value.toLowerCase().trim();if(users.some(u=>u.email===email)){rmsg.textContent='Email already registered';return}users.push({name:rn.value,email,password:rp.value});save('tsUsers',users);rmsg.textContent='Registered. Please log in.';e.target.reset()};
lf.onsubmit=e=>{e.preventDefault();let u=users.find(x=>x.email===le.value.toLowerCase().trim()&&x.password===lp.value);if(!u){lmsg.textContent='Invalid credentials';return}user={name:u.name,email:u.email};save('tsUser',user);lmsg.textContent='Welcome, '+u.name};
function logout(){user=null;localStorage.removeItem('tsUser');lmsg.textContent='Logged out'}
checkout.onsubmit=e=>{e.preventDefault();if(!user){alert('Log in first');return}let a=cart.filter(i=>i.email===user.email);if(!a.length){cmsg.textContent='Cart is empty';return}for(let i of a){let p=products.find(p=>p.id===i.id);if(!p||p.stock<i.qty){alert('Insufficient stock for '+(p?.name||'item'));return}}a.forEach(i=>products.find(p=>p.id===i.id).stock-=i.qty);let order={id:'TS'+Date.now().toString().slice(-8),email:user.email,customer:user.name,address:address.value,payment:payment.value,items:a.map(i=>({...i,name:products.find(p=>p.id===i.id).name,price:finalPrice(products.find(p=>p.id===i.id))})),total:a.reduce((s,i)=>s+finalPrice(products.find(p=>p.id===i.id))*i.qty,0),status:'Order Placed'};orders.push(order);cart=cart.filter(i=>i.email!==user.email);save('tsOrders',orders);save('tsCart',cart);save('tsProducts',products);cmsg.textContent='Order placed: '+order.id+' (demo checkout; no payment processed)';renderCart();renderAdmin()};
function renderOrders(){if(!user){orderlist.innerHTML='Please log in.';return}let a=orders.filter(o=>o.email===user.email);orderlist.innerHTML=a.map(o=>`<div class="product"><h3>${o.id}</h3><p>${o.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</p><p>Address: ${esc(o.address)}</p><p>Total: ₹${o.total}</p><p>Status: <b>${esc(o.status)}</b></p></div>`).join('')||'No orders yet.'}
function renderWish(){if(!user){wishlist.innerHTML='Please log in.';return}wishlist.innerHTML=wish.filter(w=>w.email===user.email).map(w=>{let p=products.find(p=>p.id===w.id);return p?`<div class="product">${esc(p.name)} — ₹${finalPrice(p)} <button onclick="add(${p.id})">Add to Cart</button><button onclick="toggleWish(${p.id})">Remove</button></div>`:''}).join('')||'Wishlist is empty.'}
pf.onsubmit=e=>{e.preventDefault();products.push({id:Date.now(),name:pn.value,cat:pc.value,sub:ps.value,price:Number(price.value),stock:Number(stock.value),off:Number(off.value),desc:desc.value});save('tsProducts',products);e.target.reset();renderProducts();renderAdmin()};
function del(id){if(confirm('Remove product?')){products=products.filter(p=>p.id!==id);save('tsProducts',products);renderProducts();renderAdmin()}}
function edit(id){let p=products.find(x=>x.id===id),v=prompt('New price',p.price);if(v!==null&&Number(v)>0)p.price=Number(v);let d=prompt('New description',p.desc);if(d!==null)p.desc=d;save('tsProducts',products);renderProducts();renderAdmin()}
function renderAdmin(){manage.innerHTML=products.map(p=>`<div class="product"><b>${esc(p.name)}</b> — ₹${p.price}, stock ${p.stock}<button onclick="edit(${p.id})">Edit price/description</button><button onclick="del(${p.id})">Remove</button></div>`).join('');customers.innerHTML=orders.map(o=>`<div class="product">${esc(o.customer)} (${esc(o.email)}) — ${esc(o.address)} — Order ${esc(o.id)}</div>`).join('')||'No customer checkouts yet.';adminorders.innerHTML=orders.map(o=>`<div class="product">${esc(o.id)} — ${esc(o.status)} <select id="s${o.id}"><option>Order Placed</option><option>Packed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><button onclick="setOrder('${o.id}')">Update</button></div>`).join('');orders.forEach(o=>{let s=document.getElementById('s'+o.id);if(s)s.value=o.status})}
function setOrder(id){let o=orders.find(x=>x.id===id);o.status=document.getElementById('s'+id).value;save('tsOrders',orders);renderAdmin();renderOrders()}
renderProducts();renderAdmin();
</script></body></html>
